# Chatwoot Community Edition — servicio SEPARADO de Loopchat (VPS Linux).
# Basado en docker-compose.production.yaml oficial (chatwoot/chatwoot v4.19.0), con versión fijada.
# Antes del primer despliegue: verificar que la etiqueta exista en Docker Hub y leer las notas de versión.
#   https://developers.chatwoot.com/self-hosted/deployment/docker
# Uso: cp chatwoot.env.example .env && completar && docker compose up -d
#      docker compose run --rm rails bundle exec rails db:chatwoot_prepare

x-base: &base
  image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v4.19.0}
  env_file: .env
  volumes:
    - storage_data:/app/storage
  restart: always

services:
  rails:
    <<: *base
    depends_on: [postgres, redis]
    ports:
      - "127.0.0.1:3001:3000" # detrás de un proxy TLS (Caddy/Nginx); no exponer directo
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    <<: *base
    depends_on: [postgres, redis]
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}

  redis:
    image: redis:7-alpine
    restart: always
    command: ["sh", "-c", 'redis-server --requirepass "$$REDIS_PASSWORD"']
    env_file: .env
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
