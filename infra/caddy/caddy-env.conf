# Drop-in de systemd para que Caddy lea los dominios. Instalar:
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo cp infra/caddy/caddy-env.conf /etc/systemd/system/caddy.service.d/env.conf
#   printf 'APP_DOMAIN=app.ejemplo.com\nCHATWOOT_DOMAIN=chatwoot.ejemplo.com\n' | sudo tee /etc/caddy/caddy.env
#   sudo systemctl daemon-reload && sudo systemctl restart caddy
[Service]
EnvironmentFile=/etc/caddy/caddy.env
