# CI de Loopchat: un PR que rompe pruebas o controles obligatorios queda en rojo.
# Sin secretos reales: solo claves de prueba generadas en el job y simuladores locales.
name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  TEST_DATABASE_URL: postgres://loopchat:loopchat@localhost:5432/loopchat_test

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: loopchat, POSTGRES_PASSWORD: loopchat, POSTGRES_DB: loopchat_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loopchat" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integración (PostgreSQL real + simuladores de contrato)
        run: npm run test
      - name: Regresión de auditoría (50 escenarios conversacionales + SSRF)
        run: npx vitest run -c tests/audit/vitest.audit.config.mts
      - name: Build de producción
        env:
          DATABASE_URL: postgres://build@localhost/build
          BETTER_AUTH_SECRET: ci-build-only-secret-ci-build-only-secret
          LOOPCHAT_ENCRYPTION_KEYS: "ci:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: npm run build
      - name: Dependencias de producción sin vulnerabilidades altas/críticas
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E + aislamiento HTTP entre empresas
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: loopchat, POSTGRES_PASSWORD: loopchat, POSTGRES_DB: loopchat_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loopchat" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BETTER_AUTH_SECRET: ci-e2e-only-secret-ci-e2e-only-secret-xx
      LOOPCHAT_ENCRYPTION_KEYS: "ci:AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright (escritorio 1440, móvil 390, axe-core)
        run: npm run test:e2e
      - name: Sondas HTTP de aislamiento A/B, roles, CSRF y límites (app real + datos DEMO)
        env:
          DATABASE_URL: postgres://loopchat:loopchat@localhost:5432/loopchat_e2e
          APP_URL: http://localhost:3100
          CHATWOOT_BASE_URL: http://localhost:3011
          CHATWOOT_PLATFORM_TOKEN: sim-platform-token
          CHATWOOT_WEBHOOK_TARGET_URL: http://localhost:3100
          META_GRAPH_BASE_URL: http://localhost:3011/meta-graph/v22.0
          LOOPCHAT_ALLOW_PRIVATE_URLS: "true"
          LOOPCHAT_INLINE_WORKER: "true"
          AUTH_RATE_LIMIT: "true"
          NEXT_DIST_DIR: .next-e2e
        run: |
          npx tsx tools/chatwoot-sim/server.ts & npx tsx tools/ai-sim/server.ts &
          npx next dev --port 3100 > next.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:3100/api/health >/dev/null && break; sleep 2; done
          node tests/audit/http-tenancy.audit.mjs http://localhost:3100
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  security:
    name: Secretos y análisis estático
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (binario oficial fijado y verificado por checksum)
        run: |
          V=8.21.2
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${V}_checksums.txt"
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner .
      - name: Semgrep (reglas TypeScript, Node y secretos; falla con severidad ERROR)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.95.0 \
            semgrep scan --config p/typescript --config p/nodejsscan --config p/secrets --metrics=off --severity ERROR --error src scripts tools
